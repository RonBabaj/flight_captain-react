# Paste into your nginx configuration (or custom nginx include).
# Required for SPA refresh on deep links like /search/results and /search/explore —
# .htaccess is ignored on nginx.
#
# Production note (fly-fix.com): the live edge is Nginx Proxy Manager in front of
# the flyfix-frontend / flyfix-api Docker containers. Keep these settings on that
# proxy host as well:
#   - Force SSL (http → https 301) for fly-fix.com, www.fly-fix.com, api.fly-fix.com
#   - Let's Encrypt certificate SANs must include BOTH fly-fix.com and www.fly-fix.com
#     (a cert for apex alone makes Chrome flag https://www.fly-fix.com as insecure)
#   - Prefer redirecting www → apex after Force SSL, or keep a dual-SAN cert

# HTTP → HTTPS (when this file is the edge, not only an include inside :443)
# server {
#   listen 80;
#   server_name fly-fix.com www.fly-fix.com;
#   return 301 https://fly-fix.com$request_uri;
# }

# Serves index.html for unknown paths so React Navigation can handle routing.
location / {
    try_files $uri $uri/ $uri/index.html /index.html;
}

# Optional: return 200 for SPA shell on missing routes (alternative to try_files fallback)
# error_page 404 =200 /index.html;
