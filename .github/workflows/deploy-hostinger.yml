name: Deploy frontend to Hostinger

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build Expo web
        working-directory: frontend
        env:
          EXPO_PUBLIC_API_BASE_URL: https://flight-captain-react.onrender.com
        run: npx expo export -p web

      # "Timeout (control socket)" = control connection never completed. Often: host firewall blocking
      # GitHub runner IPs, wrong host, or TLS handshake too slow. Try longer timeout, verbose logs,
      # FTP_SERVER as IP, Hostinger support, or SFTP if your plan has SSH.
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose
          # Milliseconds (action default is short); 5m helps slow TLS / busy shared hosts.
          timeout: 300000
          log-level: verbose
          local-dir: frontend/dist/
          server-dir: ./
          dangerous-clean-slate: true