name: Deploy frontend to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Expo web
        working-directory: frontend
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.fly-fix.com
        run: npx expo export -p web

      - name: Write SPA route fallbacks (nginx /search/results refresh)
        working-directory: frontend
        run: node scripts/write-spa-fallbacks.mjs

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: fly-fix-web-dist
          path: frontend/dist/
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: fly-fix-web-dist
          path: frontend/dist/

      # FTP secrets must match Hostinger hPanel → Files → FTP Accounts.
      # 530 Login incorrect = wrong host/user/password or account disabled.
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose
          timeout: 300000
          log-level: verbose
          local-dir: frontend/dist/
          server-dir: ./
          dangerous-clean-slate: true
