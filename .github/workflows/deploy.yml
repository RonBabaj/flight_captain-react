# Deploy to Ubuntu VPS via SSH whenever code is pushed to main.
# Requires GitHub Actions secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY.

name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/apps/flight_captain-react
            git pull origin main
            cd frontend
            npm ci
            EXPO_PUBLIC_API_BASE_URL=https://api.fly-fix.com npm run build
            cd ..
            docker compose build --no-cache
            docker compose up -d

      - name: Deploy over SSH (retry)
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/apps/flight_captain-react
            git pull origin main
            cd frontend
            npm ci
            EXPO_PUBLIC_API_BASE_URL=https://api.fly-fix.com npm run build
            cd ..
            docker compose build --no-cache
            docker compose up -d
