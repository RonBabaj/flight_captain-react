# Deploy to Ubuntu VPS via SSH whenever code is pushed to main.
# Requires GitHub Actions secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY.

name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy over SSH
        id: ssh1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 300s
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/apps/flight_captain-react
            git pull origin main
            cd frontend
            npm ci
            EXPO_PUBLIC_API_BASE_URL=https://api.fly-fix.com npm run build
            cd ..
            docker compose build --no-cache
            docker compose up -d

      - name: Wait before SSH retry
        if: steps.ssh1.outcome == 'failure'
        run: sleep 60

      - name: Deploy over SSH (retry)
        id: ssh2
        if: steps.ssh1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 300s
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/apps/flight_captain-react
            git pull origin main
            cd frontend
            npm ci
            EXPO_PUBLIC_API_BASE_URL=https://api.fly-fix.com npm run build
            cd ..
            docker compose build --no-cache
            docker compose up -d

      - name: Wait before second SSH retry
        if: steps.ssh1.outcome == 'failure' && steps.ssh2.outcome == 'failure'
        run: sleep 120

      - name: Deploy over SSH (second retry)
        id: ssh3
        if: steps.ssh1.outcome == 'failure' && steps.ssh2.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 300s
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/apps/flight_captain-react
            git pull origin main
            cd frontend
            npm ci
            EXPO_PUBLIC_API_BASE_URL=https://api.fly-fix.com npm run build
            cd ..
            docker compose build --no-cache
            docker compose up -d

      - name: Wait before third SSH retry
        if: steps.ssh1.outcome == 'failure' && steps.ssh2.outcome == 'failure' && steps.ssh3.outcome == 'failure'
        run: sleep 180

      - name: Deploy over SSH (third retry)
        id: ssh4
        if: steps.ssh1.outcome == 'failure' && steps.ssh2.outcome == 'failure' && steps.ssh3.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 300s
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/apps/flight_captain-react
            git pull origin main
            cd frontend
            npm ci
            EXPO_PUBLIC_API_BASE_URL=https://api.fly-fix.com npm run build
            cd ..
            docker compose build --no-cache
            docker compose up -d
