services:

  flight-scraper:
    container_name: flight-scraper
    build:
      context: ./services/flight-scraper
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: "3099"
      PLAYWRIGHT_HEADLESS: "0"
      SCRAPER_CDP_URLS: ${SCRAPER_CDP_URLS:-http://host.docker.internal:9223}
      SCRAPER_PROXY_URL: ${SCRAPER_PROXY_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy
    expose:
      - "3099"
    shm_size: "1gb"

  flyfix-api:
    container_name: flyfix-api
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      FLIGHT_SCRAPER_URL: http://flight-scraper:3099
    depends_on:
      - flight-scraper
    volumes:
      - ./backend-data:/app/data
    networks:
      - proxy
    expose:
      - "8080"

  flyfix-frontend:
    container_name: flyfix-frontend
    build:
      context: ./frontend
    restart: unless-stopped
    networks:
      - proxy
    expose:
      - "80"

networks:
  proxy:
    external: true
