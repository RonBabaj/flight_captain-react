services:

  flight-scraper:
    container_name: flight-scraper
    build:
      context: ./services/flight-scraper
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: "3099"
      PLAYWRIGHT_HEADLESS: "0"
      # Entrypoint rewrites host.docker.internal / :9223 → gateway:9224 (flight Chrome).
      # Do not use :9223 — apartment-monitor-cdp-proxy owns that (Facebook profile).
      SCRAPER_CDP_URLS: ${SCRAPER_CDP_URLS:-http://host.docker.internal:9224}
      SCRAPER_PROXY_URL: ${SCRAPER_PROXY_URL:-}
      # Warm loop + reuse headed Skyscanner tab (set SCRAPER_SKY_FRESH_TAB=1 to force new tab each search).
      SCRAPER_WARM_ON_START: ${SCRAPER_WARM_ON_START:-1}
      # Kiwi-only background warm by default — Sky deep-links while idle re-trigger PerimeterX.
      SCRAPER_WARM_LOOP_SKY: ${SCRAPER_WARM_LOOP_SKY:-0}
      SCRAPER_WARM_SKY_ON_START: ${SCRAPER_WARM_SKY_ON_START:-0}
      SCRAPER_WARM_INTERVAL_MS: ${SCRAPER_WARM_INTERVAL_MS:-1800000}
      SCRAPER_SKY_WARM_COOLDOWN_MS: ${SCRAPER_SKY_WARM_COOLDOWN_MS:-14400000}
      SCRAPER_SKY_FRESH_TAB: ${SCRAPER_SKY_FRESH_TAB:-0}
      SCRAPER_SKY_RESULTS_WAIT_MS: ${SCRAPER_SKY_RESULTS_WAIT_MS:-55000}
      SCRAPER_CDP_CONNECT_RETRIES: ${SCRAPER_CDP_CONNECT_RETRIES:-5}
      SCRAPER_PX_SOLVE_ATTEMPTS: ${SCRAPER_PX_SOLVE_ATTEMPTS:-5}
      SCRAPER_PX_HOLD_MS: ${SCRAPER_PX_HOLD_MS:-6500}
    networks:
      - proxy
    expose:
      - "3099"
    shm_size: "1gb"

  flyfix-api:
    container_name: flyfix-api
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      FLIGHT_SCRAPER_URL: http://flight-scraper:3099
      FLIGHT_SCRAPER_MAX_CONCURRENT: ${FLIGHT_SCRAPER_MAX_CONCURRENT:-1}
      # Unified search: scraper-first (GF2 optional). Keep GOOGLEFLIGHTS2_ENABLED=true for Book/Explore if you still have quota.
      FLIGHT_PROVIDERS: ${FLIGHT_PROVIDERS:-multisite,googleflights2}
      # No GF2 stagger when scraper is primary (set >0 only if you still run GF2 alongside and want OTA-first PARTIAL).
      UNIFIED_SEARCH_FAST_DELAY_MS: ${UNIFIED_SEARCH_FAST_DELAY_MS:-0}
    depends_on:
      - flight-scraper
    volumes:
      - ./backend-data:/app/data
    networks:
      - proxy
    expose:
      - "8080"

  flyfix-frontend:
    container_name: flyfix-frontend
    build:
      context: ./frontend
    restart: unless-stopped
    networks:
      - proxy
    expose:
      - "80"

networks:
  proxy:
    external: true
