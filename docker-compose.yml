services:

  flight-scraper:
    container_name: flight-scraper
    build:
      context: ./services/flight-scraper
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./backend/.env
    environment:
      PORT: "3099"
      PLAYWRIGHT_HEADLESS: "0"
      DISPLAY: ":99"
      SCRAPER_CDP_URL: ${SCRAPER_CDP_URL:-http://127.0.0.1:9223}
      SCRAPER_PROXY_URL: ${SCRAPER_PROXY_URL:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    shm_size: "1gb"

  flyfix-api:
    container_name: flyfix-api
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      FLIGHT_SCRAPER_URL: http://host.docker.internal:3099
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - flight-scraper
    volumes:
      - ./backend-data:/app/data
    networks:
      - proxy
    expose:
      - "8080"

  flyfix-frontend:
    container_name: flyfix-frontend
    build:
      context: ./frontend
    restart: unless-stopped
    networks:
      - proxy
    expose:
      - "80"

networks:
  proxy:
    external: true
